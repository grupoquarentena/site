; =============================================================================
; PHP customizado -- arquivo historico do site do Grupo QuarenteNA (MVP 2026)
; =============================================================================
; Ambiente local de execucao e teste. O MVP nunca foi publicado.

upload_max_filesize = 8M
post_max_size = 10M
memory_limit = 128M
max_execution_time = 30
date.timezone = America/Sao_Paulo

display_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off

session.cookie_httponly = 1
session.use_strict_mode = 1

; Hardening: funcoes de shell bloqueadas. proc_open NAO esta na lista porque
; a suite arquivada (tests/run.php) o utiliza no teste de concorrencia do
; contador de analytics; nenhum fluxo web do acervo usa essas funcoes.
disable_functions = exec,passthru,system,shell_exec,popen,pcntl_exec
