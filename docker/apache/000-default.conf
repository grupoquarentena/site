# =============================================================================
# VirtualHost local -- arquivo historico do site do Grupo QuarenteNA (MVP 2026)
# =============================================================================
# Uso exclusivo para teste local em 127.0.0.1. O MVP nunca foi publicado e nao
# deve ser publicado: este VirtualHost nao define dominio de producao, nao
# confia em proxies externos e nao redireciona para HTTPS.

<VirtualHost *:80>
    # Nome local (nao ha dominio publico): silencia o aviso AH00558 do Apache.
    ServerName localhost

    DocumentRoot /var/www/site/public

    <Directory /var/www/site/public>
        Options -Indexes +FollowSymLinks
        DirectoryIndex index.php
        AllowOverride None
        Require all granted
    </Directory>

    # Bloqueia qualquer tentativa de leitura de arquivos ocultos.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
